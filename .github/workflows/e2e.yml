name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
    - name: Install Gauge CLI and plugins
      uses: getgauge/setup-gauge@50709cf75e99bb852890c8826b9600a237981ff1 # master
      with:
        gauge-version: '1.6.28'
        gauge-plugins: html-report, screenshot
    # The python plugin refuses to start unless the venv holds getgauge at
    # exactly the plugin's own version, and it tries to `pip install` the match
    # -- which fails in a uv venv that has no pip. Keep this version in sync
    # with the getgauge version pinned in uv.lock. setup-gauge cannot pin a
    # plugin version itself, so this runs as its own step.
    - name: Install Gauge python plugin matching the locked getgauge
      run: gauge install python --version 0.5.0
    - name: Install dependencies
      run: uv sync --group dev --frozen
    - name: Smoke test packaged CLI entry point
      run: |
        uv tool install .
        cdcasasagi --help
    - name: Run Gauge E2E
      working-directory: e2e
      run: uv run --no-sync gauge run specs
